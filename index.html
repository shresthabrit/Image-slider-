
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Gallery</title>
    <link rel="stylesheet" href="css/style.css">
     <script src="js/slider.js" defer></script>
</head>

<body>
    <section id="gallery">
        <div class="gallery-container">
            <h1>My Gallery</h1>
            <div class="slider">
                <div class="slider-track">
                    <div class="slide">
                        <img src="image/crochet.jpg" alt="Gallery image 1">
                    </div>
                    <div class="slide">
                        <img src="image/fireworks.jpg" alt="Gallery image 2">
                    </div>
                    <div class="slide">
                        <img src="image/flowers.jpg" alt="Gallery image 3">
                    </div>
                    <div class="slide">
                        <img src="image/lantern.jpg" alt="Gallery image 4">
                    </div>
                    <div class="slide">
                        <img src="image/nature1.jpg" alt="Gallery image 5">
                    </div>
                </div>
                <button class="slider-btn prev"
                        type="button"
                        aria-label="Previous image">
                    &#10094;
                </button>
                <button class="slider-btn next"
                        type="button"
                        aria-label="Next image">
                    &#10095;
                </button>

            </div>
            <div class="slider-dots" aria-label="Choose an image"></div>

        </div>
    </section>
</body>
</html>
